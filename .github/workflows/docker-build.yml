name: Build and Push WebSSH Image

on:
  push:
    branches:
      - main       # oppure master, a seconda del branch predefinito
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch: # Permette anche di avviare il build manualmente con un clic da GitHub

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione QEMU (per supporto multi-arch se serve)
        uses: docker/setup-qemu-action@v3

      - name: Configurazione Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login su Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push dell'immagine
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webssh:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/webssh:${{ github.sha }}

